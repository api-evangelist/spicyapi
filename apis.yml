- aid: spicyapi:spicyapi-openai-compatible-api
  name: SpicyAPI OpenAI Compatible API
  description: >-
    OpenAI / Anthropic protocol shells under `/v1` and the Google Gemini shell under `/v1beta`. They share
    API keys, limits, validation and billing with `/api/v1` but use the external protocol's own request,
    response and error shapes. On these paths the API key may be sent as `Authorization: Bearer <key>`,
    `x-api-key: <key>` (Anthropic SDKs) or `x-goog-api-key: <key>` (Google GenAI SDKs); `/api/v1` accepts
    only `Authorization: Bearer`. Keys in the URL query string are never accepted.
  humanURL: https://docs.spicyapi.ai/docs/api-reference
  baseURL: https://api.spicyapi.ai
  tags:
  - OpenAI Compatible
  properties:
